name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same Bun version as ci.yml: bun.lock is written by Bun, and `--frozen-lockfile`
      # can fail when a newer Bun writes it differently. "latest" could break the deploy
      # without any change here; raise this together with ci.yml, deliberately.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Since v4 this leaves dotfiles out of the artifact; dist/ has none (public/ only holds
      # favicon.svg). Add `include-hidden-files: true` if one is ever needed there.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

